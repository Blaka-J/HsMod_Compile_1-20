name: Build HsMod DLL

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'  # Minecraft模组通常用.NET 6
        
    - name: Show project structure
      shell: cmd
      run: |
        @echo off
        echo 当前目录：%CD%
        echo.
        echo HsMod文件夹内容：
        dir HsMod
        echo.
        echo 确认项目文件：
        if exist "HsMod\HsMod.csproj" (
          echo √ 找到 HsMod.csproj
          type "HsMod\HsMod.csproj" | findstr "TargetFramework"
        ) else (
          echo × 未找到项目文件
          exit 1
        )
        
    - name: Restore NuGet packages
      run: dotnet restore HsMod/HsMod.csproj
      
    - name: Build Release version
      run: dotnet build HsMod/HsMod.csproj --configuration Release --no-restore
      
    - name: Show build output
      shell: cmd
      run: |
        @echo off
        echo ===== 编译输出目录 =====
        if exist "HsMod\bin\Release" (
          echo Release目录内容：
          dir "HsMod\bin\Release" /s /b
        )
        
        if exist "HsMod\bin\Debug" (
          echo Debug目录内容：
          dir "HsMod\bin\Debug" /s /b
        )
        
    - name: Upload main DLL
      uses: actions/upload-artifact@v4
      with:
        name: HsMod-Main-DLL
        path: HsMod/bin/Release/net6.0-windows/HsMod.dll
        if-no-files-found: error
        
    - name: Upload all Release files
      uses: actions/upload-artifact@v4
      with:
        name: HsMod-Complete-Build
        path: HsMod/bin/Release/
        if-no-files-found: error
